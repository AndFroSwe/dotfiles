[config]

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors/matugen.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.hyprland]
input_path = "./templates/hyprland-colors.lua"
output_path="~/.config/hypr/modules/colors.lua"

[templates.omp]
input_path = "./templates/omp.json"
output_path = "/tmp/omp-palette.json"
post_hook = 'jq -s ".[0].palette = .[1] | .[0]" ~/.config/oh-my-posh/themes/base.omp.json /tmp/omp-palette.json > ~/.config/oh-my-posh/themes/theme.omp.json'

[templates.color-scheme]
input_path = "./templates/Matugen.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

[templates.wofi]
input_path = "./templates/colors.css"
output_path = "~/.config/wofi/colors.css"

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'
